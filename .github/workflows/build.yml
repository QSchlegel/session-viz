# The compiled output in plugins/session-viz/scripts/ is committed on purpose:
# a Claude Code plugin is installed by copying the repo, with no build step at
# install time, and the skills invoke `node ${CLAUDE_PLUGIN_ROOT}/scripts/*.mjs`
# directly. So the artifact has to be present and correct in the tree.
#
# Committing build output means it can drift. An edit to a .mts that skips
# `npm run build` ships the OLD behaviour while the source reads as if the
# change landed — and the diff shows only the .mts, so review sees nothing
# wrong. This is the check that makes that impossible.
#
# Nothing here interpolates event data. Every step reads only the checked-out
# tree, so there is no path for a branch name, title or commit message to reach
# a shell.

name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22 is the floor, not a preference: the Cursor adapter reads SQLite
      # through `node:sqlite`, which does not exist before it. Building on an
      # older runtime would typecheck and then fail at runtime for every user.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # The picker page's script is a string until a browser reads it, so the
      # compiler cannot see a stray backtick or a `\n` escaped once instead of
      # twice. Both have shipped; both killed the whole page while every markup
      # check passed, because the markup was fine. This runs the real page's
      # real script against a stubbed stream.
      - name: Picker
        run: node plugins/session-viz/test/picker.mjs

      # /qcontrib prints "0 repo name(s)" above the values it is about to send,
      # and a contribution cannot be recalled. This is the test that guards that
      # sentence.
      - name: Findings
        run: node plugins/session-viz/test/finding.mjs

      # The claims contract. A number that appears in six places was kept correct
      # in six places by hand, and the comments said so: report.ts in the sibling
      # repository carries "If one of the two ever moves, both move" about a
      # ceiling this repository also defines. An inventory of both trees found 825
      # claim statements, 71 distinct claims and 35 pairs that already disagreed —
      # four simultaneous answers for how many commands there are, and a headline
      # privacy sentence generous by two. This is the check that makes those
      # arithmetic rather than remembered. It also reads the sibling repository
      # when it is checked out beside this one, and prints what it skipped when it
      # is not.
      - name: Claims
        run: node plugins/session-viz/test/claims.mjs

      # The facts projection: the second payload a report ships, and the first
      # one a colleague can query. It is built from a spine carrying the absolute
      # transcript path, the dash-encoded project key, the working directory and
      # the verbatim prompt — four things that each contain either a username or
      # what somebody typed. This runs the projection against a spine where every
      # refused field holds a unique sentinel and asserts none of them survive.
      # A shape check passes on a projection that spreads the whole session in
      # under a key nobody looked at; five of these assertions go red on exactly
      # that one-line mistake.
      - name: Facts projection
        run: node plugins/session-viz/test/facts.mjs

      # Tool-call retention. The most exposing thing this extractor can produce,
      # and therefore the one whose default matters most: off unless asked for,
      # recorded in the spine so a consumer can tell which happened, and redacted
      # in the INPUT and the RESULT rather than only in the prompt. One assertion
      # here chooses the implementation rather than describing it — a secret whose
      # value runs to the end of its JSON string, which stringify-redact-reparse
      # loses entirely and a leaf-by-leaf walk does not.
      - name: Retained traces
        run: node plugins/session-viz/test/trace.mjs

      # A derive nobody has watched fail is documentation. This copies the tree to
      # a temp directory, breaks each claim on purpose — adds a thirteenth skill,
      # removes a frontmatter flag, wires the credential into a command that does
      # not touch it — and asserts the derive notices. The failure it guards
      # against is the one that cannot be seen from a green build: a derive that
      # greps for a string which has since moved returns the old answer and passes
      # while the registry is wrong.
      - name: Derives prove themselves
        run: node contract/derive.mjs --prove

      # `wrote_ok` is a tool-result observation. The separate artifact probe
      # must keep path-format drift and local absence visible without silently
      # promoting either into a delivery verdict.
      - name: Artifact evidence
        run: node plugins/session-viz/test/artifact-probe.mjs

      # JSON.stringify escapes what JSON needs escaped, and HTML is not JSON: it
      # leaves `<` alone. A graph node id carrying `</script>` would end the
      # script element early and the rest of the page would parse as markup.
      # Node ids are built from artifacts harvested out of tool-call inputs, and
      # a skill name is copied with no character constraint at all — so nothing
      # upstream guarantees this cannot happen. This renders the real page and
      # asserts against the emitted document, not against the helper.
      - name: Script escaping
        run: node plugins/session-viz/test/script-escape.mjs

      # The graph's gates decide which turns reach the page, and a gate that
      # drops a node another edge still points at leaves a stub hanging in the
      # SVG. This renders the real page and asserts against the emitted payload.
      - name: Graph
        run: node plugins/session-viz/test/graph.mjs

      # The graph's framing, theme, zoom and replay. The layout bug this guards
      # against does not look like a bug in any single number: one simulation
      # over every node lets the unconnected ones settle on a wide ring, the
      # ring sets the bounding box, and the connected component -- the entire
      # content of the picture -- normalises down to half a percent of the
      # frame. Remove the per-component packing and five assertions here go red.
      - name: Graph view
        run: node plugins/session-viz/test/graph-view.mjs

      # The page's glass layer and the /qbl backlog. Both shipped with suites
      # that nothing ran, which is the same as shipping without them.
      - name: Glass
        run: node plugins/session-viz/test/glass.mjs

      - name: Backlog
        run: node plugins/session-viz/test/qbl.mjs

      # The turn cards’ hierarchy and the contrast that carries it.
      - name: Cards
        run: node plugins/session-viz/test/cards.mjs

      # The brand chrome on every wrapper, the evidence package, and the two
      # together on the rendered report pages.
      - name: Brand
        run: node plugins/session-viz/test/brand.mjs

      - name: Evidence package
        run: node plugins/session-viz/test/bundle.mjs

      - name: Reports
        run: node plugins/session-viz/test/reports.mjs

      # /qlive sends turn shape to a workspace console. Two rules carry the
      # whole feature: the trailing turn is never sent (extract closes it
      # artificially, so it looks finished when it is not), and the live ledger
      # is never contrib.json (loadState reads an unrecognised shape as
      # "nothing sent", which re-contributes the corpus into an endpoint with
      # no idempotency key).
      - name: Live
        run: node plugins/session-viz/test/qlive.mjs

      # Five suites that gated nothing until this block existed. Each one covers
      # a claim the tool makes to a reader who cannot check it: which files a
      # turn touched, what an earlier session concluded and how old that is,
      # what a follow-up prompt may say about a session it was not built from,
      # and what the bill of materials does and does not know.
      - name: Recorded file paths
        run: node plugins/session-viz/test/paths.mjs

      - name: Intent carried across sessions
        run: node plugins/session-viz/test/intent.mjs

      - name: Drill-down and the appendix
        run: node plugins/session-viz/test/followup.mjs

      - name: Bill of materials
        run: node plugins/session-viz/test/sbom.mjs

      # The consent gate on shipping a session to the cloud — "nothing leaves
      # this machine unless you were shown what would leave". It is the largest
      # claim the tool makes and it was the last suite running nowhere.
      # The dependency layer, which is mostly a set of assertions about what it
      # refuses to draw.
      - name: The bill on the canvas
        run: node plugins/session-viz/test/bom-view.mjs

      - name: Consent before anything is sent
        run: node plugins/session-viz/test/ship.mjs

      - name: Committed output matches source
        run: |
          # --porcelain, not `git diff`: a build that emits a NEW module leaves it
          # untracked, and `git diff` cannot see an untracked file. A source file
          # added without its compiled output therefore passed this gate green
          # while the plugin shipped without the module it imports.
          untracked="$(git status --porcelain -- plugins/session-viz/scripts | grep '^??' || true)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo
            echo "::error::plugins/session-viz/scripts has build output that was never committed."
            echo "Run 'npm run build' and 'git add plugins/session-viz/scripts'. An untracked"
            echo "module is invisible to 'git diff', so this gate used to pass while the"
            echo "installed plugin was missing a file it imports at startup."
            exit 1
          fi
          if ! git diff --exit-code --stat -- plugins/session-viz/scripts; then
            echo
            echo "::error::plugins/session-viz/scripts is stale — it does not match plugins/session-viz/src."
            echo "Run 'npm run build' and commit the result. The scripts/ directory is what"
            echo "actually runs when the plugin is installed; leaving it behind ships the old"
            echo "behaviour while the source reads as though the change landed."
            exit 1
          fi

      # Two manifests declare a version and they must not disagree. They did:
      # package.json sat at 0.5.0 while plugin.json had reached 0.8.0, three
      # releases apart, and nothing anywhere noticed.
      - name: Versions agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          plg=$(node -p "require('./plugins/session-viz/.claude-plugin/plugin.json').version")
          if [ "$pkg" != "$plg" ]; then
            echo "::error::package.json says $pkg, plugin.json says $plg. They name one release."
            exit 1
          fi
          echo "both at $pkg"

      # The version is what the plugin cache keys installs on, so shipping a
      # changed plugin under an unchanged version puts two different tools in
      # one directory name. That happened: nine commits landed on 0.8.0,
      # including an entire new harness and a fix that moved 274 runs from
      # `no_intent` to `wrote_ok`. Anyone comparing a report from either side of
      # that got different answers with nothing to tell them why.
      #
      # PRs only. A push to main has no base to compare against, and rerunning
      # this on the merge commit would fail every time.
      - name: Version bumped when the plugin changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fetched explicitly: actions/checkout gives a shallow clone that does
          # not contain the base commit, so `git diff` against it would error
          # rather than report no changes — a check that passes by breaking.
          git fetch --no-tags --depth=1 origin "$BASE"
          # TWO dots, not three. `A...B` diffs from the merge base, and a
          # --depth=1 fetch has no history to find one in, so the three-dot form
          # silently reported zero changed files and passed — this check's first
          # run said "plugin source unchanged" on a PR that rewrote runs.mts and
          # added version.mts. Two dots compares the commits directly and needs
          # no ancestry.
          changed=$(git diff --name-only "$BASE" HEAD -- plugins/session-viz/src plugins/session-viz/skills | wc -l)
          if [ "$changed" -eq 0 ]; then echo "plugin source unchanged — no bump needed"; exit 0; fi
          before=$(git show "$BASE:plugins/session-viz/.claude-plugin/plugin.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "")
          after=$(node -p "require('./plugins/session-viz/.claude-plugin/plugin.json').version")
          if [ "$before" = "$after" ]; then
            echo "::error::$changed source/skill file(s) changed but the version is still $after."
            echo "Bump plugins/session-viz/.claude-plugin/plugin.json and package.json together."
            echo "The plugin cache is keyed by version: an unchanged number ships new behaviour"
            echo "into the directory the old behaviour already occupies."
            exit 1
          fi
          echo "version $before -> $after"

      # The plugin claims to run with no dependencies. That is load-bearing:
      # it is installed by copy, so anything in `dependencies` would simply be
      # absent at runtime. devDependencies are fine — they only build it.
      - name: No runtime dependencies
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies || {}).join(' ')")
          if [ -n "$deps" ]; then
            echo "::error::package.json declares runtime dependencies: $deps"
            echo "The plugin is installed by copying the repo, with no npm install, so these"
            echo "would be missing when it runs. Use devDependencies, or vendor the code."
            exit 1
          fi

      # Smoke test on the runner's empty corpus. transcriptRoots() returns
      # nothing there — the case most likely to divide by zero or index an empty
      # array, and the one no local run ever exercises, because a developer's
      # machine always has transcripts on it.
      #
      # A non-zero exit is NOT the failure condition: extract, runs and corpus
      # deliberately refuse with a one-line message when there is no corpus, and
      # asserting exit 0 would fail CI on correct behaviour. What must never
      # happen is an uncaught exception, so the stack trace is what is checked.
      - name: Commands survive an empty corpus
        run: |
          cd plugins/session-viz
          failed=0
          for s in extract runs corpus doctor ship; do
            err=$(node "scripts/$s.mjs" --json 2>&1 >/dev/null) || true
            if printf '%s' "$err" | grep -qE '^\s+at |Error: .*\n.*at '; then
              echo "::error::$s.mjs threw on an empty corpus instead of refusing cleanly"
              printf '%s\n' "$err" | head -20
              failed=1
            else
              echo "$s: ok ($(printf '%s' "$err" | head -1 | cut -c1-60))"
            fi
          done
          exit $failed
